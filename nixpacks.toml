[phases.setup]
nixPkgs = ["python311Full"]

[phases.install]
# 1. install uv (for lock-file export only)
# 2. export pinned deps from uv.lock → requirements.txt
# 3. pip installs into Nixpacks' /opt/venv (where the runtime python lives)
cmds = [
  "pip install uv",
  "uv export --frozen --no-dev -o requirements.txt",
  "pip install -r requirements.txt"
]

[start]
cmd = "cd src && python run_service.py"
