services:
  - type: web
    name: fitnessbuddy-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && python run_service.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: UV_SYSTEM_PYTHON
        value: "1"
      - key: DATABASE_TYPE
        value: sqlite
      - key: SQLITE_DB_PATH
        value: /tmp/xbuddy_checkpoints.db
      - key: HOST
        value: "0.0.0.0"
      - key: ANTHROPIC_API_KEY
        sync: false
